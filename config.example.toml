# LLM Proxy Configuration
#
# Copy this file to config.toml and adjust as needed.
# The proxy hot-reloads this file on changes — no restart needed.

[defaults]
# Maximum retry attempts (9999 = effectively unlimited)
max_retries = 9999

# Base delay for exponential backoff (milliseconds)
base_delay_ms = 1000

# Maximum delay cap for backoff (milliseconds)
max_delay_ms = 60000

# Total wait budget in milliseconds (0 = rely on client disconnect)
# Set to a positive value as a safety net for clients without timeouts.
max_total_wait_ms = 0

# Connection establishment timeout (seconds)
connect_timeout_secs = 30

# HTTP status codes that trigger a retry
retry_status_codes = [429, 500, 502, 503, 504, 408, 529]

# ── Named Routes ───────────────────────────────────────────────────────────
#
# Named routes match the first path segment of the URL.
# Example: /tkehub/v1/chat/completions → routes.tkehub
#
# The proxy detects the inbound protocol from the URL path:
#   /v1/responses        → Responses API
#   /v1/chat/completions → Chat Completions
#   /v1/messages         → Anthropic Messages
#
# upstream_formats declares what the upstream supports (ordered by preference).
# If the inbound format is in the list → passthrough (no conversion).
# If not → convert to the first format in the list.
# Empty (unset) → passthrough anything.

[routes.tkehub]
target = "http://tkehub.woa.com"
upstream_formats = ["responses"]

# ── Default Route ──────────────────────────────────────────────────────────
#
# The default route matches URLs WITHOUT a route name prefix.
# Example: /v1/responses → routes.default (model field determines upstream)
#
# This enables unified access: all AI CLI tools point to the same address
# (http://127.0.0.1:8888), and the model field in the request body
# determines which upstream to use.
#
# The default route has no route-level target — each model has its own.

[routes.default]

# GLM: upstream supports Chat + Anthropic, auto-detects and converts if needed
[routes.default.models."tkehub-glm"]
target = "http://tkehub.woa.com"
upstream_formats = ["chat", "anthropic"]
api_key = "${TKEHUB_API_KEY}"
upstream_model = "tke/glm-latest"

# DeepSeek: upstream only supports Chat, converts from Responses/Anthropic
[routes.default.models."tkehub-deepseek"]
target = "https://tokenhub.tencentmaas.com"
upstream_formats = ["chat"]
api_key = "${TKEHUB_API_KEY}"
upstream_model = "deepseek-chat"

# ── Model-level Configuration ──────────────────────────────────────────────
#
# All fields are optional — only specified fields override the route-level config.
#
#   target           — upstream base URL (llm-proxy auto-appends standard API path)
#   upstream_formats — list of protocols the upstream supports, ordered by preference
#                      ["responses"] / ["chat"] / ["anthropic"] / ["chat", "anthropic"]
#   api_key          — API key for the upstream (supports ${ENV_VAR} expansion)
#   upstream_model   — rewrite the model field in requests (and auto-rewrite responses)
#   max_retries, base_delay_ms, max_delay_ms, max_total_wait_ms,
#   connect_timeout_secs, retry_status_codes
#
# ── Named Route with Model Overrides ───────────────────────────────────────
#
# [routes.tkehub]
# target = "http://tkehub.woa.com"
# upstream_formats = ["responses"]  # upstream natively supports responses
#
# # DeepSeek goes to a different upstream, needs conversion to chat
# [routes.tkehub.models."tke/deepseek-flash-latest"]
# target = "https://tokenhub.tencentmaas.com"
# upstream_formats = ["chat"]
# api_key = "${TKEHUB_API_KEY}"
# upstream_model = "deepseek-chat"
